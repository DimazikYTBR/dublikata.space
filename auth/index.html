<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | dublikata</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #121214;
            --text-primary: #ffffff;
            --text-secondary: #86868b;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--surface-color);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .greeting {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-provider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            border: 1px solid var(--border);
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-github {
            background: #ffffff;
            color: #000000;
            border: none;
        }
        .btn-github:hover { background: #dedede; }

        #telegram-widget-wrap {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            min-height: 50px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="greeting">Welcome</div>
        <div class="subtitle">Sign in to access ecosystem</div>

        <div class="auth-buttons">
            <a href="https://github.com/login/oauth/authorize?client_id=Ov23liXXXXXXXXXXXXXX" class="btn-provider btn-github">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                Sign in with GitHub
            </a>
        </div>

        <div id="telegram-widget-wrap">
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-login="dublikata_bot" 
                    data-size="large" 
                    data-userpic="true" 
                    data-onauth="onTelegramAuth(user)">
            </script>
        </div>

        <a href="/" class="back-link">← Back to home</a>
    </div>

<script>
    // Функция, которую вызывает Telegram при успешном входе через виджет
    function onTelegramAuth(user) {
        const userData = {
            name: user.first_name + (user.last_name ? ' ' + user.last_name : ''),
            avatar: user.photo_url || ''
        };
        localStorage.setItem('dublikata_user', JSON.stringify(userData));
        window.location.href = '/';
    }

    // Обработка возврата после GitHub (если настроишь OAuth)
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    if (code) {
        // Уведомление об успешной авторизации через GitHub
        const userData = {
            name: 'GitHub User',
            avatar: 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'
        };
        localStorage.setItem('dublikata_user', JSON.stringify(userData));
        window.location.href = '/';
    }
</script>
</body>
</html>
